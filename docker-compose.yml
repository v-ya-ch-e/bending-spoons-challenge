services:
  frontend:
    build:
      context: ./frontend
      args:
        DB_API_BASE_URL: http://db-rest-api:8000/db-api
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DB_API_BASE_URL: http://db-rest-api:8000/db-api
    depends_on:
      - db-rest-api
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  db-rest-api:
    build:
      context: ./db-rest-api
    env_file:
      - path: .env
        required: false
    environment:
      ROOT_PATH: /db-api
      APP_VERSION: "0.1.0"
    ports:
      - "127.0.0.1:${DB_REST_API_PORT:-8001}:8000"
    restart: unless-stopped
