services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    restart: unless-stopped

  db-rest-api:
    build:
      context: ./db-rest-api
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DB_REST_API_PORT}:8000"
    restart: unless-stopped
